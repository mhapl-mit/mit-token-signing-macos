# macOS build on GitHub Actions, the repository on GitHub is only a mirror for builds on a Mac.
# Builds the same way as a colleague with build/macos/build.sh and keeps the package and the log.
name: macOS

on:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (macos-15-intel, macos-15, macos-latest)
        default: macos-15-intel

jobs:
  build:
    # Apple silicon runners are often not available, the Intel one builds the same universal package
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: sh build/macos/build.sh ${{ github.run_number }} 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Test with a SoftHSM token
        run: bash host-test/macos-ui-test.sh dist/*.pkg ui-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build
          path: |
            build.log
            dist/*.pkg
            ui-test
