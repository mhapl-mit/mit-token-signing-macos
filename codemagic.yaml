# macOS build on Codemagic (Mac mini M2). The code comes from the GitHub mirror
# mhapl-mit/mit-token-signing-macos, the main repository is on Gitea.
# Builds the same way as a colleague with build/macos/build.sh, signed with the Developer ID
# certificates of M.I.T. Consulting (Team ID 6XLXADSD3Q) and notarized by Apple, installs the
# package and keeps it with the log.
# The keys are only in the Codemagic environment group developer_id (application settings,
# Environment variables): DEVELOPER_ID_APPLICATION_P12 and DEVELOPER_ID_INSTALLER_P12 (base64),
# DEVELOPER_ID_P12_PASSWORD and APP_STORE_CONNECT_PRIVATE_KEY (the .p8 of the App Store Connect
# API team key "Codemagic notarization"). See docs/ACCOUNTS.md.
workflows:
  macos:
    name: macOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      groups:
        - developer_id
      vars:
        APP_STORE_CONNECT_KEY_ID: A45Z3QV9VZ
        APP_STORE_CONNECT_ISSUER_ID: c4fd09cd-0b9e-4804-bf5b-9c1401576554
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    scripts:
      - name: Signing keychain
        script: |
          #!/bin/bash
          set -e
          for v in DEVELOPER_ID_APPLICATION_P12 DEVELOPER_ID_INSTALLER_P12 DEVELOPER_ID_P12_PASSWORD APP_STORE_CONNECT_PRIVATE_KEY; do
            [ -n "${!v}" ] || { echo "FAIL: $v is missing in the Codemagic group developer_id"; exit 1; }
          done
          KEYS=$HOME/signing
          mkdir -p "$KEYS"
          # Intermediate certificate of Developer ID G2 into the system keychain, without it the
          # identities are CSSMERR_TP_NOT_TRUSTED and codesign fails with errSecInternalComponent
          curl -sSf -o "$KEYS/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          sudo security add-certificates -k /Library/Keychains/System.keychain "$KEYS/DeveloperIDG2CA.cer" || true
          # Codemagic CLI: a new unlocked default keychain that codesign and pkgbuild may use
          keychain initialize
          # Spaces and line breaks copied with the values into Codemagic are not part of them
          P12_PASSWORD=$(printf '%s' "$DEVELOPER_ID_P12_PASSWORD" | tr -d '[:space:]')
          echo "p12 password: ${#P12_PASSWORD} characters (24 expected)"
          for p12 in DEVELOPER_ID_APPLICATION_P12 DEVELOPER_ID_INSTALLER_P12; do
            printf '%s' "${!p12}" | tr -d '[:space:]' | base64 --decode > "$KEYS/$p12.p12"
            # Not secret, compare with the hash of the .p12 file kept with the keys
            echo "$p12: $(shasum -a 256 "$KEYS/$p12.p12" | cut -c1-16)"
            # By default only codesign and productsign may use the key, pkgbuild signs the package
            keychain add-certificates --certificate "$KEYS/$p12.p12" --certificate-password "$P12_PASSWORD" \
              --allow-all-applications
            rm -f "$KEYS/$p12.p12"
          done
          security find-identity -v
          # notarytool with the App Store Connect API key, read by build/macos/build.sh and the Makefile
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEYS/AuthKey.p8"
          grep -q "BEGIN PRIVATE KEY" "$KEYS/AuthKey.p8" || { echo "FAIL: APP_STORE_CONNECT_PRIVATE_KEY is not a .p8 key"; exit 1; }
          echo "NOTARY_ARGS=--key $KEYS/AuthKey.p8 --key-id $APP_STORE_CONNECT_KEY_ID --issuer $APP_STORE_CONNECT_ISSUER_ID" >> "$CM_ENV"
      - name: Build
        script: |
          #!/bin/bash
          set -o pipefail
          # Build numbers continue after 1.2.0.15, the last one from GitHub Actions
          sh build/macos/build.sh $((BUILD_NUMBER + 15)) 2>&1 | tee build.log
      # The machine does not allow clicking into the dialogs nor screenshots, not even with the
      # permissions written to TCC.db, so the signing test with SoftHSM (host-test/macos-ui-test.sh)
      # runs on GitHub Actions by hand. Here only the installed host answers with its version.
      - name: Install and check the version
        script: |
          #!/bin/bash
          set -e
          PKG=$(ls dist/mit-token-signing_*.pkg)
          VERSION=${PKG##*_}
          # Signed by the Developer ID of M.I.T. Consulting, notarized and accepted by Gatekeeper
          pkgutil --check-signature "$PKG" | grep -q "Developer ID Installer: M.I.T. Consulting, s.r.o. (6XLXADSD3Q)" ||
            { pkgutil --check-signature "$PKG"; echo "FAIL: the package is not signed by the Developer ID"; exit 1; }
          xcrun stapler validate "$PKG"
          spctl --assess --type install --verbose=2 "$PKG"
          sudo installer -pkg "$PKG" -target /
          APP="/Library/Application Support/MIT Token Signing/chrome-token-signing.app"
          python3 host-test/sign-test.py "$APP/Contents/MacOS/chrome-token-signing" --version "${VERSION%.pkg}"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "TeamIdentifier=6XLXADSD3Q" ||
            { echo "FAIL: the host is not signed by the Developer ID"; exit 1; }
          spctl --assess --type execute --verbose=2 "$APP"
          # Without it the hardened runtime refuses drivers signed by their vendor (ProID+, SafeNet),
          # SoftHSM from Homebrew is not signed by anybody and loads anyway
          codesign -d --entitlements - "$APP" | grep -q disable-library-validation ||
            { echo "FAIL: the host lacks com.apple.security.cs.disable-library-validation"; exit 1; }
          echo "OK: signed, notarized, library validation disabled"
    publishing:
      scripts:
        - name: Remove the keys
          script: rm -rf "$HOME/signing"
    artifacts:
      - build.log
      - dist/*.pkg
